# The workspace exists to make the layering a compile error rather than a
# convention. Each crate below may only name the ones beneath it, so a cycle
# that used to be a comment going stale is now a build failure.
#
# Bottom to top: core (plumbing), data (arrays and the store), model (the
# vocabulary a client and the server share), scene (the tree and its commands),
# filter (arrays in, arrays out), draw (pixels), view (viewport and interface),
# grpc (the wire). `iris3d` itself is wiring only.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
# Plain defaults. Both sides of an earlier merge took a feature away and both
# were right: `bevy_solari` went with the raytracing pathway it existed for, and
# `dynamic_linking` went so the machine-global rustc-wrapper can cache — it does
# not cache dylibs, and the two together fail to link.
bevy = { version = "0.19.0" }
bevy_egui = "0.41.1"
clap = { version = "4.5", features = ["derive"] }
prost = "0.14.3"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tonic = "0.14.5"
tonic-prost = "0.14.5"
tonic-prost-build = "0.14.5"
log = { version = "*", features = ["max_level_debug", "release_max_level_warn"] }
futures = "0.3.32"
tokio-stream = "0.1.18"
crossbeam-channel = "0.5.15"
egui-snarl = { version = "0.11.0", default-features = false }
async-stream = "0.3.6"
glob = "0.3.3"

iris3d-core = { path = "crates/iris3d-core" }
iris3d-data = { path = "crates/iris3d-data" }
iris3d-model = { path = "crates/iris3d-model" }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
