syntax = "proto3";

package iris3d.v1;

// SceneService is the whole surface of the iris3d scene: what is in it, where
// it sits, and how it is drawn.
//
// Things are kept apart, and the splits are the reason the API looks the way it
// does.
//
// **Data** is arrays and nothing more. UploadData takes them in and hands back a
// handle each; no object appears, nothing is drawn, and the name on an array is
// a label rather than a role. One array can feed several representations, and a
// representation can read arrays that arrived at different times, so tying data
// to the thing that draws it would be the wrong shape.
//
// An **object** is a place in the tree and a name. It holds no data at all.
//
// An **actor** is one way of drawing something, a thing in its own right with
// its own handle. It is a child of the object it appears under, and it binds the
// arrays it reads to the inputs its kind declares. Showing one array in two
// places is two actors binding it under two parents. A **subset** narrows an
// actor to part of what it binds, which is what makes several worth having —
// one structure drawn as cartoon over its protein and as sticks over its
// ligand.
//
// Data is described in the style of a numpy array — a raw little-endian byte
// buffer plus a dtype and a shape — rather than as `repeated` scalar fields.
// This keeps large uploads compact on the wire, keeps decoding cheap in every
// client language, and lets iris3d accept data in formats it will never
// implement a parser for: a client parses locally and pushes the arrays.
//
// The same position is taken wherever a question could be answered on either
// side. Selections arrive as index or mask arrays rather than as a query
// language, because a client already holds the structure needed to express
// "chain A" far better than a grammar invented here could. And nothing is
// inferred from what an array is called: a representation declares the element
// types and shapes it accepts, and a client binds whatever it uploaded.
//
// **Structure above the element** — a molecule's residues and chains, and
// anything shaped like them — is more arrays, not a message of its own. Two
// pieces make it work. A dense integer array per element says which group each
// belongs to, and further arrays keyed on that index carry the group's own
// properties. So residues are a `residue_index` per atom, running 0..r, plus
// arrays of length r holding each residue's name, its author numbering, and its
// secondary structure.
//
// The dense index is the part worth insisting on, because author numbering is
// not a key: residue ids repeat across chains, skip, go negative, and carry
// insertion codes, so 100, 100A and 100B are three residues wearing two
// numbers. Author numbering is a *label*, carried in the side arrays like any
// other property.
//
// This shape is not molecular. It is the same shape a mesh's material groups or
// a point cloud's clusters take, which is why it is described here rather than
// in a message about proteins. It also keeps hierarchy free of time: coordinates
// gain frames, and which residue an atom belongs to does not.
//
// The same two pieces carry **text**, one level further down. A name is not
// sent once per element; an integer index is, and a string array holds the
// distinct values it points at. So an atom's name is an `atom_name_index` per
// atom beside an `atom_name` array of the names that occur. This keeps every
// string array small, which DTYPE_STRING requires — see below for why.
//
// What can be drawn is not fixed by this schema. Actor kinds come from
// whichever rendering backends the server was built with, so ask
// ListActorKinds rather than carrying a table that will go stale.
service SceneService {
  // Uploads arrays and nothing else.
  //
  // No object, no place in the tree, nothing drawn. Each array comes back with
  // a handle, and an actor is built by binding those handles to the inputs its
  // kind declares — see ListActorKinds for what each one accepts.
  //
  // A name in the header is a label, for the inventory and for a person reading
  // it. It is not a role: what an array *is* to a representation is settled when
  // it is bound, not guessed from what it was called. Upload the same array once
  // and bind it to as many actors as you like.
  //
  // The first message MUST carry `header`; every later one MUST carry `chunk`,
  // addressing an array by its index in the header. Nothing is committed until
  // every declared array has received exactly its `byte_length` bytes, so a
  // stream that ends early, overruns, or arrives out of order leaves the scene
  // untouched. A DTYPE_STRING array declares 0 bytes and carries its values in
  // the header, so it satisfies that rule as soon as it is declared — an upload
  // of nothing but strings is a single message.
  rpc UploadData(stream UploadDataRequest) returns (UploadDataResponse);

  // Lists the arrays currently held, whether or not anything draws them.
  rpc ListData(ListDataRequest) returns (ListDataResponse);

  // Forgets arrays.
  //
  // The bytes go when nothing refers to them any more, so releasing a handle an
  // actor still uses frees nothing until that actor goes too. A handle that was
  // already gone is not an error; the response says what was actually held.
  rpc ReleaseData(ReleaseDataRequest) returns (ReleaseDataResponse);

  // Creates an object that holds no data.
  //
  // Objects form a tree, and an empty object is how you make a pure grouping
  // node: parent several objects to it and they share its transform. There is
  // no separate "group" type — anything can parent anything, so a mesh may
  // equally be the parent of a field that should follow it.
  rpc CreateObject(CreateObjectRequest) returns (CreateObjectResponse);

  // Moves an object within the tree.
  rpc SetParent(SetParentRequest) returns (SetParentResponse);

  // Sets an object's local placement, relative to its parent.
  rpc SetTransform(SetTransformRequest) returns (SetTransformResponse);

  // Lists the objects currently present in the scene.
  rpc ListObjects(ListObjectsRequest) returns (ListObjectsResponse);

  // Removes one object from the scene.
  //
  // Deletes exactly what is named, and nothing else. Every child survives it,
  // in the way that suits what it is: a child object becomes a root, since its
  // transform is a place it still occupies; a child actor is detached and
  // stops being drawn, since its transform is only an offset from the object
  // it was under. A detached actor keeps its arrays and settings and can be
  // placed again with SetActor.
  //
  // No arrays are freed either; ReleaseData is what does that, and RemoveActor
  // is what destroys an actor.
  rpc DeleteObject(DeleteObjectRequest) returns (DeleteObjectResponse);

  // Draws something under an object.
  //
  // Adds; it does not replace. An object may carry any number of actors at
  // once — a protein as cartoon and as licorice, a mesh as surface and as
  // wireframe — and each is configured independently. The reverse holds too:
  // one actor may be drawn under any number of objects.
  //
  // `parents` says where it appears — one object, several, or none named at
  // all, in which case one is created for you. *What* it draws is in `params`,
  // as arrays bound to the inputs its kind declares.
  //
  // Naming several objects is how one drawing appears in several places while
  // staying one actor: change it once and every copy changes.
  rpc AddActor(AddActorRequest) returns (AddActorResponse);

  // Changes an existing actor. Only what is named is altered.
  rpc SetActor(SetActorRequest) returns (SetActorResponse);

  // Removes one actor, and every appearance of it, leaving the objects it was
  // drawn under alone.
  rpc RemoveActor(RemoveActorRequest) returns (RemoveActorResponse);

  // Lists actors, optionally only those drawn under one object. An actor drawn
  // under several is one entry whichever way it is asked for.
  rpc ListActors(ListActorsRequest) returns (ListActorsResponse);

  // Lists the ways of drawing this build actually supports.
  //
  // Kinds are contributed by whichever rendering backends are compiled in
  // rather than fixed by the schema, so a client that asks cannot offer a
  // choice that silently does nothing — and needs no hardcoded table of its
  // own.
  rpc ListActorKinds(ListActorKindsRequest) returns (ListActorKindsResponse);

  // Adds a filter: something that reads arrays and writes arrays, and draws
  // nothing.
  //
  // A filter is how derived data is made — a colour map applied to a field, a
  // ribbon swept through a backbone, a surface extracted from a grid. What
  // comes out are ordinary arrays with ordinary handles, so an actor binds them
  // exactly as it binds an upload and cannot tell the two apart.
  //
  // That separation is the point. Generating geometry and displaying it are
  // different jobs, so one generated result can feed several actors — drawn as
  // a lit surface and as an absorbing medium at once, built once — and adding a
  // way to display something does not multiply the ways of generating it.
  //
  // The reply carries a handle for each declared output, allocated by this
  // call. They are bindable immediately: until the first run finishes they name
  // empty arrays, and an actor bound to one draws nothing rather than failing.
  rpc AddFilter(AddFilterRequest) returns (AddFilterResponse);

  // Changes an existing filter. Only what is named is altered.
  //
  // Refused with FAILED_PRECONDITION if the binding would feed a filter its own
  // output, directly or through others. Such a graph could never come to rest.
  rpc SetFilter(SetFilterRequest) returns (SetFilterResponse);

  // Removes a filter and forgets the arrays it was writing.
  //
  // This is the only way those handles go away: ReleaseData refuses them one at
  // a time, because releasing an array something is still generating leaves the
  // filter producing into nothing.
  rpc RemoveFilter(RemoveFilterRequest) returns (RemoveFilterResponse);

  rpc ListFilters(ListFiltersRequest) returns (ListFiltersResponse);

  // Lists the ways of deriving data this build supports, and what each takes
  // and produces. As with ListActorKinds, ask rather than assume.
  rpc ListFilterKinds(ListFilterKindsRequest) returns (ListFilterKindsResponse);
}

// Dtype is the element type of a buffer's raw bytes. Encoding is always
// little-endian and densely packed in C (row-major) order.
enum Dtype {
  DTYPE_UNSPECIFIED = 0;
  DTYPE_UINT8 = 1;
  DTYPE_INT8 = 2;
  DTYPE_UINT16 = 3;
  DTYPE_INT16 = 4;
  DTYPE_UINT32 = 5;
  DTYPE_INT32 = 6;
  DTYPE_UINT64 = 7;
  DTYPE_INT64 = 8;
  DTYPE_FLOAT32 = 9;
  DTYPE_FLOAT64 = 10;

  // Text, one string per element. The only type that is not raw bytes: the
  // strings travel in `BufferSpec.values` and no chunk is ever sent, so
  // `byte_length` is 0.
  //
  // It exists because labelling data is not numeric and has nowhere else to
  // go. A chain's id, a residue's name, an atom's name — see the discussion of
  // hierarchy on SceneService. Nothing draws a string; a string array is read
  // by the interface and by whoever is looking at the scene.
  //
  // Not chunked, which is the constraint worth understanding: the values
  // travel in the upload header, and a header is a single message. So a string
  // array is bounded by what the transport will decode, and **must not grow
  // with the element count**. A per-atom name column measures about 3.8 bytes
  // an atom, which reaches the server's decode limit somewhere near two million
  // atoms and fails at the transport rather than anywhere useful.
  //
  // The rule that follows: **text is carried once per distinct value, never
  // once per element.** Send an integer index per element and a string array of
  // the values it indexes. This is not a workaround for the limit — it is the
  // same dense-index-plus-side-array shape described on SceneService, applied
  // one level further down, and it is what text columns want anyway. They are
  // low-cardinality in practice: a structure with 2396 atoms has 85 distinct
  // atom names, and that count barely moves as the structure grows.
  //
  // A string array carrying more text than the server will hold is rejected
  // with a message saying so. If a genuinely high-cardinality column ever turns
  // up — one distinct value per element, which nothing here has — chunking can
  // be added without changing what a string array *is*.
  DTYPE_STRING = 11;
}

// BufferSpec declares one array in an upload.
//
// The name is a label — for the inventory, and for whoever reads it later. It
// carries no meaning to the server: an array called "xyz" binds to a
// representation's `positions` input exactly as one called "positions" does.
// There was a table of conventional names here once, and recognising them was
// how the server guessed what an upload was; a representation declares what it
// accepts instead, and the caller binds.
//
// Bond orders, where a representation reads them, follow biotite's BondType
// enum — adopted rather than reinvented:
//
//   0 any            1 single            2 double             3 triple
//   4 quadruple      5 aromatic single   6 aromatic double    7 aromatic triple
//   8 coordination   9 aromatic
//
// Secondary structure, where a representation reads it, is **DSSP's eight
// states** — one integer per residue:
//
//   0 none/unassigned   1 H alpha helix   2 B beta bridge   3 E strand
//   4 G 3-10 helix      5 I pi helix      6 T turn          7 S bend
//
// Eight rather than the helix/strand/coil three, because cartoon rendering that
// wants to draw a 3-10 helix differently from an alpha helix cannot get there
// from three letters, and the difference costs nothing: it is one integer
// either way. A client whose assigner only produces three maps them up — helix
// to 1, strand to 3, everything else to 0 — and loses nothing it had.
//
// A grid's geometry is not an array and never arrives as one: a volume takes its
// dims, origin and spacing as VectorParam values, which is the whole reason the
// grid type is worth having.
message BufferSpec {
  // Label for this array. Unique within one upload.
  string name = 1;

  // Element type of the raw bytes.
  Dtype dtype = 2;

  // Dimensions, outermost first. Must contain no zero-length axis.
  repeated uint64 shape = 3;

  // Total size of the buffer in bytes. Must equal the product of `shape`
  // multiplied by the size of one `dtype` element; sending it explicitly lets
  // the server allocate up front and detect truncated streams.
  //
  // MUST be 0 for a DTYPE_STRING array, which carries no bytes and receives no
  // chunks.
  uint64 byte_length = 4;

  // The strings themselves, for a DTYPE_STRING array and for nothing else.
  //
  // Densely packed in the same C order the raw types use, so the count must
  // equal the product of `shape` exactly. MUST be empty for every other dtype:
  // an array is one thing or the other, and accepting both would leave two
  // sources for the same element.
  //
  // Inline rather than chunked because the upload completes in the header — a
  // string array is committed by the first message, with no chunk addressing
  // it afterwards.
  //
  // Never echoed back. A BufferSpec returned by UploadData or ListData leaves
  // this empty, for the reason SubsetInfo leaves a selection's values empty: a
  // description of an array is not the array, the client is the side that sent
  // the text, and `shape` already says how much of it there is.
  repeated string values = 5;
}


// Chunk carries a contiguous slice of one buffer's bytes.
message Chunk {
  // Index into the header's array list.
  uint32 buffer_index = 1;

  // Byte offset within that buffer. Must equal the number of bytes already
  // received for the buffer — slices arrive in order and may not be resent.
  uint64 offset = 2;

  // The bytes themselves. Keep messages comfortably under the transport's
  // maximum message size; 1-4 MiB per chunk is a reasonable default.
  bytes data = 3;
}

// DataHandle identifies one uploaded array for the lifetime of the running
// scene. Drawn from the same sequence as ObjectHandle and ActorHandle, so no id
// ever names two different things, and never reused after release.
message DataHandle {
  uint64 id = 1;
}

message UploadDataRequest {
  oneof payload {
    DataHeader header = 1;
    Chunk chunk = 2;
  }
}

// DataHeader declares every array in one upload. Chunks address them by the
// index they appear at here.
message DataHeader {
  repeated BufferSpec arrays = 1;
}

message UploadDataResponse {
  // One entry per declared array, in declaration order.
  repeated DataInfo arrays = 1;

  // Total bytes accepted, summed across every array in this upload.
  //
  // Counts the chunked bytes, so a DTYPE_STRING array adds nothing and an
  // upload of nothing but strings reports 0. It reports what the stream carried
  // in chunks, which is what a caller checking its own transfer wants.
  uint64 total_bytes = 2;
}

// DataInfo describes one held array without transferring its contents.
// GeometrySpec describes one mesh a handle names.
//
// The counterpart of BufferSpec, and thin for the same reason: enough to say
// what a handle is and enough to decide whether an input can read it, without
// being a second copy of the mesh. The vertices themselves stay on the GPU;
// there is no fetch for them yet.
message GeometrySpec {
  // Label for this mesh, taken from the output that produced it.
  string name = 1;

  uint64 vertices = 2;
  uint64 triangles = 3;

  // A normal per vertex. Read by lighting and by a glass shell, never by the
  // absorbance accumulation.
  bool normals = 4;

  // A linear RGB colour per vertex, already mapped. Which ramp and what range
  // produced them was the colormap filter's business.
  bool colours = 5;
}

// DataInfo describes what one handle names.
//
// Field 2 was `spec`, when every handle named an array. It is the `buffer` arm
// of the oneof now, at the same number and type, because a handle may also name
// geometry.
message DataInfo {
  DataHandle handle = 1;

  oneof spec {
    BufferSpec buffer = 2;
    GeometrySpec geometry = 3;
  }
}

message ListDataRequest {}

message ListDataResponse {
  // Arrays first, then meshes, each in handle order. The field is named
  // `arrays` from when that was all there was.
  repeated DataInfo arrays = 1;
}

message ReleaseDataRequest {
  repeated DataHandle handles = 1;
}

message ReleaseDataResponse {
  // The subset of `handles` that was actually held.
  repeated DataHandle released = 1;
}

// ObjectHandle identifies an object for the lifetime of the running scene.
// Handles are not reused after deletion and are not stable across restarts.
message ObjectHandle {
  uint64 id = 1;
}

// ObjectInfo describes a place in the scene tree.
//
// Fields 3, 4 and 5 were `buffers`, `total_bytes` and `dataset_kind` — what an
// object held and what shape the server inferred it to be. An object holds no
// data now; ask ListData what is resident.
message ObjectInfo {
  reserved 3, 4, 5;

  ObjectHandle handle = 1;
  string name = 2;

  // Everything drawing here. Empty means nothing is.
  //
  // This field previously carried a list of kind names. It had no handles, so
  // there was no way to say *which* of an object's actors to change — and,
  // until AddActor, nothing to change them with.
  //
  // An actor listed here need not be placed here: it draws this object's data,
  // but check its `parent` for where it appears.
  repeated ActorInfo actors = 6;

  // Parent in the scene tree, absent for a root object.
  optional ObjectHandle parent = 7;
}

// ActorHandle identifies one way of drawing something.
//
// Drawn from the same sequence as ObjectHandle — no id ever names both — but a
// distinct type, so the two cannot be passed in each other's place.
message ActorHandle {
  uint64 id = 1;
}

// ParamValue is one setting on an actor.
//
// Which variant is expected for a given parameter is declared by its
// ParamSpec. A value of the wrong type, or one outside the declared range, is
// not an error: it is clamped or replaced with the default, so a client can
// never drive the renderer somewhere it cannot come back from.
message ParamValue {
  oneof value {
    double number = 1;
    bool flag = 2;

    // A field name, or one option out of a fixed set. Which of the two is
    // decided by the parameter's ParamSpec.
    string text = 3;

    // A fixed-length vector: an origin, a spacing, a size in samples. Its
    // length must match the components the ParamSpec declares.
    VectorValue vector = 5;

    // An array uploaded with UploadData, bound to an ArrayParam input.
    //
    // Geometry travels as a parameter on purpose. An actor's arrays and its
    // settings are set by the same call, merged by the same rule, and described
    // by the same declaration, so rebinding what an actor draws is the same
    // kind of operation as moving a slider.
    DataHandle data = 4;
  }
}

message FloatParam {
  double default_value = 1;
  double min = 2;
  double max = 3;

  // Hint that useful values span orders of magnitude, so a control should be
  // laid out logarithmically.
  bool logarithmic = 4;
}

message BoolParam {
  bool default_value = 1;
}


// ChoiceParam takes one option out of a fixed set. A value outside the set is
// rejected rather than corrected, because there is no nearest valid choice.
message ChoiceParam {
  repeated string options = 1;
  string default_value = 2;
}

// ParamSpec declares one setting of an actor kind: what it is called, what
// type it takes and what values are allowed.
message ParamSpec {
  // Key used in the `params` maps below.
  string id = 1;

  // Human-readable name.
  string label = 2;

  // Field 5 was `field`, naming a field on the object an actor drew. An actor
  // binds its arrays directly now, so there is nothing to name.
  reserved 5;

  oneof kind {
    FloatParam number = 3;
    BoolParam flag = 4;
    ChoiceParam choice = 6;
    ArrayParam array = 7;
    VectorParam vector = 8;
    GeometryParam geometry = 9;
  }
}

// VectorValue carries a fixed-length vector of numbers.
//
// `double` rather than `float` because these also carry counts: a grid's dims
// are integers, and float32 stops representing whole numbers exactly at 16.8
// million, which the sample count of a 256^3 grid is not far from.
message VectorValue {
  repeated double components = 1;
}

// VectorParam is a fixed-length vector of numbers, such as a grid's origin,
// spacing or dimensions.
//
// One message for every length rather than separate Vec2/Vec3/Vec4 types, so a
// two-component parameter is this same message asking for two components. Every
// component shares one range, which suits everything wanted so far: a spacing is
// positive on all axes, an origin unbounded on all of them.
message VectorParam {
  // How many components. A value of the wrong length is rejected rather than
  // padded — a two-component origin is a mistake, and inventing the third would
  // place data somewhere nobody asked for.
  uint32 components = 1;

  repeated double default_value = 2;
  double min = 3;
  double max = 4;

  // Whole numbers only, for counts. Offer an integer control rather than a
  // fractional one.
  bool integral = 5;
}

// ArrayParam is an array the representation reads: positions, indices, a scalar
// field. This is how a kind states what it needs in order to draw anything.
//
// It replaces guessing a role from a buffer's name. A client asks
// ListActorKinds, sees that "points" wants float32 [n, 3] under "positions",
// and binds an array it uploaded — so an array called "xyz", or "coords", or
// nothing in particular, works exactly as well.
message ArrayParam {
  // Element types accepted. Empty accepts any.
  repeated Dtype dtypes = 1;

  // Shape, one entry per axis, where 0 accepts any length. Positions are
  // [0, 3], a triangle index array [0, 3], a scalar field [0]. Empty accepts
  // any shape at all.
  repeated uint64 shape = 2;

  // Whether the representation can draw without it. Positions cannot be
  // omitted; a field that only tints something can.
  bool required = 3;
}

// GeometryParam is a mesh the representation draws, bound as one handle:
// vertices, triangles and whatever attributes came with them.
//
// Not an ArrayParam of a particular shape, because it is not numbers the
// representation decodes. It is geometry something else assembled, and every
// consumer references it rather than building its own — so a ribbon drawn as a
// lit surface and as an absorbing medium is one upload rather than two.
//
// Bind the `geometry` output of a filter. Arrays you uploaded yourself become
// one by going through the "geometry" filter kind, which is deliberately the
// same path a computed mesh takes rather than a second one.
//
// There is nothing to declare about what it must carry. A kind reads what it was
// given — a medium asks for normals only when its shell is on, so refusing a
// mesh without them would refuse the commoner case — and says so if it cannot
// use it. What a handle actually carries is in GeometrySpec; ask ListData.
message GeometryParam {
  // Whether the representation can draw without it.
  bool required = 1;
}

// Colouring is a filter, not a message here. `Color`, `ColorSpec` and `Range`
// were how an actor took its colour when every actor carried one; they are gone
// with it. Bind an RGB array to the kind's `colour` input — see AddFilter and
// the `colormap` kind — and set the flat colour through the `tint` parameter.
// The field numbers that used them stay reserved where they were.

// Subset restricts an actor to part of what it binds.
//
// This is what several actors under one object are for: chain A as cartoon and
// the ligand as ball-and-stick is one structure drawn twice over different
// parts of it.
//
// The selection is carried inline rather than as a bound array. It could be one
// now — UploadData would take it — but it is a property of this actor rather
// than data anyone else would bind, and selections are small: a mask over 250k
// points is 250 KB.
//
// There is no selection language. iris3d's position throughout is that clients
// parse their own formats and push arrays, and a client already holds the
// residue and chain structure needed to express "chain A" far more naturally
// than a grammar invented here would.
//
// A selection that does not fit the data — the wrong length for a mask, or
// nothing left after dropping out-of-range indices — draws everything and logs
// a warning rather than drawing nothing, which would be indistinguishable from
// a broken renderer.
message Subset {
  enum Encoding {
    ENCODING_UNSPECIFIED = 0;

    // `data` is element indices, in any order. Out-of-range entries are
    // dropped.
    ENCODING_INDICES = 1;

    // `data` is one value per element, non-zero to keep. Must have exactly as
    // many entries as there are elements.
    ENCODING_MASK = 2;
  }

  // What the values index into. Points and atoms, or cells and bonds.
  enum Association {
    ASSOCIATION_UNSPECIFIED = 0;
    ASSOCIATION_PER_POINT = 1;
    ASSOCIATION_PER_CELL = 2;
  }

  // Raw little-endian values, packed as for BufferSpec.
  bytes data = 1;

  Dtype dtype = 2;

  Encoding encoding = 3;

  // Defaults to per-point when unspecified.
  Association association = 4;
}

// ActorInfo describes one way something is being drawn.
message ActorInfo {
  ActorHandle handle = 1;

  // Registered kind id, e.g. "points" or "ball-and-stick". See ListActorKinds.
  string kind = 2;

  // Field 3 was `source`, the object whose data was drawn.
  reserved 3;

  // Field 4 was `parent`, the single object it was drawn under. An actor can
  // be drawn under several at once now; see `parents`.
  reserved 4;
  reserved "parent";

  // Complete and in range, whatever was sent to produce it.
  map<string, ParamValue> params = 5;

  // Field 6 was `color`, a ramp plus a range plus a flat colour carried by
  // every actor. Colouring is a filter now: bind an RGB array to the kind's
  // `colour` input — see AddFilter and the `colormap` kind — and set the flat
  // colour through the `tint` parameter like any other setting.
  reserved 6;

  // False if this actor has been hidden individually.
  //
  // This is the setting, not whether anything reaches the screen. An object
  // hidden above it does not show up here, and neither does being detached —
  // a detached actor is not drawn whatever this says, and this is what it
  // goes back to once it has an object again.
  bool visible = 7;

  // How much of the bound data is drawn. Absent means all of it.
  //
  // The selection values themselves are not echoed back — they can be large and
  // the client sent them — so `data` is empty here and only the encoding,
  // dtype and element count are reported.
  optional SubsetInfo subset = 8;

  // Every object this actor is drawn under, in handle order.
  //
  // One actor under several objects is one drawing appearing in several
  // places: one mesh, one set of parameters, and every copy changes together.
  // Two actors binding the same arrays is the other thing — two drawings that
  // happen to look alike, configured one at a time.
  //
  // Empty draws nothing, which is where deleting the last object it was under
  // leaves it. The actor is untouched and still has its arrays and settings;
  // give it a parent to put it back on screen.
  repeated ObjectHandle parents = 9;
}

// SubsetInfo describes an actor's selection without returning it.
message SubsetInfo {
  Subset.Encoding encoding = 1;
  Subset.Association association = 2;

  // Number of elements the selection keeps.
  uint64 selected = 3;
}

// ActorKindInfo describes a way of drawing that this build supports.
message ActorKindInfo {
  // Same as the map key in ListActorKindsResponse. Kept so a single kind can be
  // passed around without its key.
  string id = 1;
  string label = 2;

  // Field 3 was `supports`, a list of dataset kinds this could draw. An actor
  // binds its own arrays now, so the object it hangs under says nothing about
  // what can draw there, and every kind is offered for every object.
  reserved 3;

  repeated ParamSpec params = 4;

  // Field 5 was `shared`, saying whether this id meant the same thing under
  // every rendering backend. One pathway is built, so there is nothing for a
  // kind to be portable across; a client asks this RPC to learn what the server
  // it is talking to can draw, which was always the reliable question.
  reserved 5;
}

message AddActorRequest {
  // Field 1 was `source`, the object whose data to draw. An actor binds its
  // arrays through `params` now, so there is no one object it reads.
  reserved 1;

  // Registered kind id. REQUIRED: ask ListActorKinds and name one. There is no
  // default — how a dataset should look is the caller's judgement, and the
  // server's only basis for guessing was the order its backends registered in.
  string kind = 2;

  // Field 3 was `parent`, a single object. See `parents`.
  reserved 3;
  reserved "parent";

  // Settings to override. Anything not named takes the kind's default — this
  // is a new actor, so there is no previous value to keep.
  map<string, ParamValue> params = 4;

  // Field 5 was `color`. See ActorInfo.
  reserved 5;

  // Absent draws the whole dataset.
  optional Subset subset = 6;

  // The objects to draw under: whose transforms it inherits, and where it sits.
  //
  // Empty creates one, named after the kind and placed at the origin. An actor
  // has to be under something — it has no place of its own — and a caller with
  // nothing to group it under would otherwise have to call CreateObject first
  // every single time. The handle comes back in `actor.parents`.
  //
  // Naming several draws this one actor in each of them at once.
  repeated ObjectHandle parents = 7;
}

message AddActorResponse {
  ActorInfo actor = 1;
}

message SetActorRequest {
  ActorHandle handle = 1;

  // Settings to change. Anything not named keeps its current value — unlike
  // AddActor, where it takes the default.
  map<string, ParamValue> params = 2;

  // Field 3 was `color`. See ActorInfo.
  reserved 3;

  // Hide or show this actor alone, without touching its object.
  optional bool visible = 4;

  // Absent leaves the selection alone; present replaces it.
  optional Subset subset = 5;

  // Go back to drawing the whole dataset. Needed as its own field because an
  // absent `subset` already means "leave it alone", so there is otherwise no
  // way to say "clear it".
  bool clear_subset = 6;

  // Replace the set of objects this actor is drawn under.
  //
  // Absent leaves them alone. Present replaces the whole set, so this both adds
  // an appearance and takes one away; an empty list takes the actor off screen
  // without removing it.
  //
  // Here rather than on SetParent, which moves objects and takes one handle. An
  // actor outlives the objects it is drawn under, so this is how one that lost
  // them is drawn again, and how one drawing is put in several places.
  optional ObjectHandles parents = 8;
}

// A list of object handles, so an optional one can be told from an empty one.
//
// A bare `repeated` field cannot express that difference, and SetActor needs
// both: leave the placements alone, or take them all away.
message ObjectHandles {
  repeated ObjectHandle handles = 1;
}

message SetActorResponse {
  ActorInfo actor = 1;
}

message RemoveActorRequest {
  ActorHandle handle = 1;
}

message RemoveActorResponse {
  // False if no actor with that handle was present.
  bool removed = 1;
}

message ListActorsRequest {
  // Restrict to actors drawn under this object. Absent lists all of them.
  //
  // Filtered on placement, not on what is read: an actor reads any number of
  // arrays and no one object.
  optional ObjectHandle parent = 1;
}

message ListActorsResponse {
  repeated ActorInfo actors = 1;
}

message FilterHandle {
  uint64 id = 1;
}

// FilterInfo describes one filter and, crucially, where to find what it makes.
message FilterInfo {
  FilterHandle handle = 1;

  // Registered kind id, e.g. "colormap". See ListFilterKinds.
  string kind = 2;

  // Complete and in range, whatever was sent to produce it. Array inputs appear
  // here as `data` values, exactly as an actor's bindings do.
  map<string, ParamValue> params = 3;

  // Where each declared output can be found, in the kind's declaration order.
  //
  // **This is what you bind.** These handles belong to the filter and live as
  // long as it does: a run rewrites the arrays behind them rather than
  // replacing them, so a binding made once stays valid however many times the
  // filter re-runs.
  repeated FilterOutput outputs = 4;
}

message FilterOutput {
  // Output id as declared by the kind, e.g. "colour" or "positions".
  string id = 1;
  DataHandle handle = 2;
}

// FilterKindInfo is a way of deriving data, and what it takes and produces.
message FilterKindInfo {
  string id = 1;
  string label = 2;

  // Settings and array inputs together, as for an actor kind.
  repeated ParamSpec params = 3;

  // What this kind writes. Declared rather than discovered, so a caller knows
  // an output is float32 [n, 3] before running anything.
  repeated OutputSpec outputs = 4;
}

// OutputSpec describes one thing a filter writes.
//
// Fields 3 and 4 were `dtype` and `shape`, when every output was an array. They
// are inside ArrayOutput now, because an output may also be geometry.
message OutputSpec {
  reserved 3, 4;

  string id = 1;
  string label = 2;

  oneof kind {
    ArrayOutput array = 5;
    GeometryOutput geometry = 6;
  }
}

// ArrayOutput is an array of numbers, described the way an uploaded one is.
message ArrayOutput {
  Dtype dtype = 1;

  // Shape, where 0 is an axis decided at run time: [0, 3] is three components
  // per element, however many elements there turn out to be. This is the form
  // of the output, never its size.
  repeated uint64 shape = 2;
}

// GeometryOutput is one mesh, bindable to any GeometryParam input.
//
// Nothing to declare: which attributes a run produces depends on what was bound
// to it, so the answer comes back in GeometrySpec after it has run rather than
// being promised in advance.
message GeometryOutput {}

message AddFilterRequest {
  // Registered kind id. REQUIRED: ask ListFilterKinds and name one.
  string kind = 1;

  // Settings and bindings. Anything unset takes the kind's default; a required
  // array input left unbound is refused.
  map<string, ParamValue> params = 2;
}

message AddFilterResponse {
  FilterInfo filter = 1;
}

message SetFilterRequest {
  FilterHandle handle = 1;

  // Settings to change. Anything not named keeps its current value — unlike
  // AddFilter, where it takes the default.
  map<string, ParamValue> params = 2;
}

message SetFilterResponse {
  FilterInfo filter = 1;
}

message RemoveFilterRequest {
  FilterHandle handle = 1;
}

message RemoveFilterResponse {
  // False if no filter with that handle was present.
  bool removed = 1;
}

message ListFiltersRequest {}

message ListFiltersResponse {
  // In handle order, so a listing is stable between calls.
  repeated FilterInfo filters = 1;
}

message ListFilterKindsRequest {}

message ListFilterKindsResponse {
  // Keyed by kind id, as ListActorKinds is, and for the same reason: every
  // caller is looking one up by name.
  map<string, FilterKindInfo> kinds = 1;
}

message ListActorKindsRequest {}

message ListActorKindsResponse {
  // Keyed by kind id: "points", "surface", "volume", "ball-and-stick". A map
  // rather than a list because every caller is looking one up by name — to bind
  // its inputs, or to check a kind it was given still exists.
  map<string, ActorKindInfo> kinds = 1;
}

message ListObjectsRequest {}

message ListObjectsResponse {
  repeated ObjectInfo objects = 1;
}

message CreateObjectRequest {
  // Human-readable label. Need not be unique.
  string name = 1;
}

message CreateObjectResponse {
  ObjectHandle handle = 1;
}

message SetParentRequest {
  ObjectHandle handle = 1;

  // The new parent. Omit to detach, making the object a root.
  optional ObjectHandle parent = 2;

  // Adjust the object's local transform so it does not move in world space.
  // Without this the object keeps its local transform and therefore shifts by
  // whatever the new parent's transform is.
  bool keep_world_transform = 3;
}

message SetParentResponse {}

message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

// A rotation as a unit quaternion.
message Quaternion {
  float x = 1;
  float y = 2;
  float z = 3;
  float w = 4;
}

// Components left unset are kept as they are, so a caller can move an object
// without disturbing its rotation or scale.
message SetTransformRequest {
  ObjectHandle handle = 1;
  optional Vector3 translation = 2;
  optional Quaternion rotation = 3;
  optional Vector3 scale = 4;
}

message SetTransformResponse {}

message DeleteObjectRequest {
  ObjectHandle handle = 1;

  // Field 2 was `recursive`, asking for the whole subtree. It guarded against
  // destroying uploaded data the caller had not named, back when an object held
  // its arrays. An object holds none now — a deletion costs one node and never
  // any data — so the flag was a choice with no consequence attached. Deleting
  // names one node: every child is detached and becomes a root, and ReleaseData
  // is what frees arrays.
  reserved 2;
}

message DeleteObjectResponse {
  // False if no object with that handle was present.
  bool deleted = 1;

  // The object removed. One handle, or none if there was nothing to delete.
  repeated ObjectHandle removed = 2;

  // Field 3 was `removed_actors`. Deleting an object used to destroy the actors
  // drawn under it, which made deletion inconsistent — child objects survived
  // and child actors did not. An actor binds arrays that outlive every node, so
  // one whose parent is gone is still completely defined and is detached
  // instead. Nothing is removed but the object named, so the list was always
  // empty. RemoveActor is what destroys an actor.
  reserved 3;
  reserved "removed_actors";
}
