syntax = "proto3";

package iris3d.v1;

// SceneService is the whole surface of the iris3d scene: what is in it, where
// it sits, and how it is drawn.
//
// Three things are kept apart, and the split is the reason the API looks the
// way it does.
//
// An **object** holds data and a place in a tree. A **representation** is one
// way of drawing an object, and is a thing in its own right with its own
// handle: an object may have several at once, each with its own settings, and
// each says separately whose data it draws and whose transform it follows.
// Point those at different objects and one dataset appears in two places
// without being uploaded twice. A **subset** narrows a representation to part
// of its data, which is what makes several of them worth having — one
// structure drawn as cartoon over its protein and as sticks over its ligand.
//
// Data is described in the style of a numpy array — a raw little-endian byte
// buffer plus a dtype and a shape — rather than as `repeated` scalar fields.
// This keeps large uploads compact on the wire, keeps decoding cheap in every
// client language, and lets iris3d accept data in formats it will never
// implement a parser for: a client parses locally and pushes the arrays.
//
// The same position is taken wherever a question could be answered on either
// side. Selections arrive as index or mask arrays rather than as a query
// language, because a client already holds the structure needed to express
// "chain A" far better than a grammar invented here could. Structure is
// inferred from buffer names, with grids the one exception — a grid's sample
// positions are implicit, so nothing about the arrays reveals it and it must
// be declared.
//
// What can be drawn is not fixed by this schema. Representation kinds come
// from whichever rendering backends the server was built with, so ask
// ListRepresentationKinds rather than carrying a table that will go stale.
service SceneService {
  // Uploads a single object as a stream of chunks.
  //
  // The first message on the stream MUST carry `header`; every subsequent
  // message MUST carry `chunk`. Chunks are written into the buffers declared
  // by the header, and the upload is only committed to the scene once every
  // declared buffer has received exactly its `byte_length` bytes. A stream
  // that ends early, overruns a buffer, or arrives out of order is rejected
  // and nothing is added to the scene.
  rpc UploadObject(stream UploadObjectRequest) returns (UploadObjectResponse);

  // Creates an object that holds no data.
  //
  // Objects form a tree, and an empty object is how you make a pure grouping
  // node: parent several objects to it and they share its transform. There is
  // no separate "group" type — anything can parent anything, so a mesh may
  // equally be the parent of a field that should follow it.
  rpc CreateObject(CreateObjectRequest) returns (CreateObjectResponse);

  // Moves an object within the tree.
  rpc SetParent(SetParentRequest) returns (SetParentResponse);

  // Sets an object's local placement, relative to its parent.
  rpc SetTransform(SetTransformRequest) returns (SetTransformResponse);

  // Lists the objects currently present in the scene.
  rpc ListObjects(ListObjectsRequest) returns (ListObjectsResponse);

  // Removes an object from the scene, releasing its buffers.
  rpc DeleteObject(DeleteObjectRequest) returns (DeleteObjectResponse);

  // Draws an object an additional way.
  //
  // Adds; it does not replace. An object may carry any number of
  // representations at once — a protein as cartoon and as licorice, a mesh as
  // surface and as wireframe — and each is configured independently.
  //
  // The data drawn and the placement it is drawn at are separate: `source`
  // says whose arrays to read, `parent` says whose transform to inherit. Give
  // them different objects and one dataset appears in two places without being
  // uploaded twice.
  rpc AddRepresentation(AddRepresentationRequest) returns (AddRepresentationResponse);

  // Changes an existing representation. Only what is named is altered.
  rpc SetRepresentation(SetRepresentationRequest) returns (SetRepresentationResponse);

  // Removes one representation, leaving the object and its data alone.
  rpc RemoveRepresentation(RemoveRepresentationRequest) returns (RemoveRepresentationResponse);

  // Lists representations, optionally only those drawing one object.
  rpc ListRepresentations(ListRepresentationsRequest) returns (ListRepresentationsResponse);

  // Lists the ways of drawing this build actually supports.
  //
  // Kinds are contributed by whichever rendering backends are compiled in
  // rather than fixed by the schema, so a client that asks cannot offer a
  // choice that silently does nothing — and needs no hardcoded table of its
  // own.
  rpc ListRepresentationKinds(ListRepresentationKindsRequest) returns (ListRepresentationKindsResponse);
}

// Dtype is the element type of a buffer's raw bytes. Encoding is always
// little-endian and densely packed in C (row-major) order.
enum Dtype {
  DTYPE_UNSPECIFIED = 0;
  DTYPE_UINT8 = 1;
  DTYPE_INT8 = 2;
  DTYPE_UINT16 = 3;
  DTYPE_INT16 = 4;
  DTYPE_UINT32 = 5;
  DTYPE_INT32 = 6;
  DTYPE_UINT64 = 7;
  DTYPE_INT64 = 8;
  DTYPE_FLOAT32 = 9;
  DTYPE_FLOAT64 = 10;
}

// BufferSpec declares one named array belonging to an object.
//
// Names are conventional rather than enforced, so that new attributes do not
// require a schema change. Recognised names today:
//
//   "positions"   float32 [n, 3]              point, vertex or atom centres
//   "colors"      uint8   [n, 3] or [n, 4]
//   "indices"     uint32  [m, k]              mesh cells; k = 2/3/4 for
//                                             lines/triangles/tetrahedra
//   "normals"     float32 [n, 3]
//   "elements"    uint8   [n]                 atomic numbers; marks a molecule
//   "bonds"       uint32  [m, 2]              atom index pairs
//   "bond_orders" uint8   [m]                 see below
//
// Bond types follow biotite's BondType enum, adopted rather than reinvented:
//
//   0 any            1 single            2 double             3 triple
//   4 quadruple      5 aromatic single   6 aromatic double    7 aromatic triple
//   8 coordination   9 aromatic
//
// Any other name is treated as a field over the object, with its kind inferred
// from the component count.
//
// None of these names apply to a grid upload, which declares its geometry in
// `ObjectHeader.grid` and carries nothing but fields. See [Grid].
message BufferSpec {
  // Identifier for this buffer, unique within the object.
  string name = 1;

  // Element type of the raw bytes.
  Dtype dtype = 2;

  // Dimensions, outermost first. Must contain no zero-length axis.
  repeated uint64 shape = 3;

  // Total size of the buffer in bytes. Must equal the product of `shape`
  // multiplied by the size of one `dtype` element; sending it explicitly lets
  // the server allocate up front and detect truncated streams.
  uint64 byte_length = 4;
}

// Grid declares a regular, axis-aligned grid.
//
// The one structure that cannot be inferred from the buffers, which is why it
// is declared rather than guessed. Every other dataset kind is recognisable
// from its arrays — "positions" and "indices" make a mesh, "elements" makes a
// molecule — but a grid's sample points are *implicit*, so there is no array
// whose presence gives it away and no array whose contents carry the spacing.
//
// Nothing here is uploaded per point. A grid of 256^3 samples describes its
// geometry in nine numbers rather than 50 million coordinates, which is the
// reason to have the type at all.
//
// Sample `(i, j, k)` sits at `origin + (i, j, k) * spacing`.
//
// Values arrive with **k varying fastest**, then `j`, then `i`. That is what a
// numpy array of shape `(x, y, z)` gives you from a plain `.ravel()`, because C
// order runs the last axis fastest. It matches the ordering the other buffers
// already use, where the last axis of an `[n, 3]` array is the contiguous one.
message Grid {
  // Position of sample (0, 0, 0).
  Vector3 origin = 1;

  // Distance between adjacent samples on each axis. Every component must be
  // greater than zero.
  Vector3 spacing = 2;

  // Number of samples along each axis. Every component must be at least one.
  Dimensions dims = 3;
}

// Dimensions is a count along each axis, as distinct from Vector3, which is a
// measurement in world units.
message Dimensions {
  uint32 x = 1;
  uint32 y = 2;
  uint32 z = 3;
}

// ObjectHeader opens an upload and declares everything that will follow.
message ObjectHeader {
  // Human-readable label. Need not be unique.
  string name = 1;

  // The buffers that make up this object, in the order they are indexed by
  // `Chunk.buffer_index`. Must contain at least one entry.
  repeated BufferSpec buffers = 2;

  // Declares the buffers to be fields sampled over a regular grid.
  //
  // Present, the buffers carry no geometry and every one of them is a field:
  // send no "positions" and no "indices". Absent, the server infers the
  // structure from the buffer names as before.
  //
  // A field's association follows its length. One value per sample is
  // per-point; one value per cell — `(x-1) * (y-1) * (z-1)` of them — is
  // per-cell. This is the only upload where the server can tell the two apart,
  // because it is the only one that knows both counts.
  optional Grid grid = 3;
}

// Chunk carries a contiguous slice of one buffer's bytes.
message Chunk {
  // Index into `ObjectHeader.buffers`.
  uint32 buffer_index = 1;

  // Byte offset within that buffer. Must equal the number of bytes already
  // received for the buffer — slices arrive in order and may not be resent.
  uint64 offset = 2;

  // The bytes themselves. Keep messages comfortably under the transport's
  // maximum message size; 1-4 MiB per chunk is a reasonable default.
  bytes data = 3;
}

message UploadObjectRequest {
  oneof payload {
    ObjectHeader header = 1;
    Chunk chunk = 2;
  }
}

message UploadObjectResponse {
  // Handle for the newly created object.
  ObjectHandle handle = 1;

  // Total number of buffer bytes accepted, summed across all buffers.
  uint64 total_bytes = 2;
}

// ObjectHandle identifies an object for the lifetime of the running scene.
// Handles are not reused after deletion and are not stable across restarts.
message ObjectHandle {
  uint64 id = 1;
}

// ObjectInfo describes an object without transferring its contents.
message ObjectInfo {
  ObjectHandle handle = 1;
  string name = 2;
  repeated BufferSpec buffers = 3;
  uint64 total_bytes = 4;

  // Structure the server inferred from the uploaded buffers: "points", "mesh",
  // "grid", "molecule", "raw" when nothing was recognised, or "empty" for an
  // object that holds no data at all. Inference is provisional — a later
  // revision should let the client state this outright.
  string dataset_kind = 5;

  // Everything currently drawing this object's data. Empty means nothing is.
  //
  // This field previously carried a list of kind names. It had no handles, so
  // there was no way to say *which* of an object's representations to change —
  // and, until AddRepresentation, nothing to change them with.
  //
  // A representation listed here need not be placed here: it draws this
  // object's data, but check its `parent` for where it appears.
  repeated RepresentationInfo representations = 6;

  // Parent in the scene tree, absent for a root object.
  optional ObjectHandle parent = 7;
}

// RepresentationHandle identifies one way of drawing something.
//
// Drawn from the same sequence as ObjectHandle — no id ever names both — but a
// distinct type, so the two cannot be passed in each other's place.
message RepresentationHandle {
  uint64 id = 1;
}

// ParamValue is one setting on a representation.
//
// Which variant is expected for a given parameter is declared by its
// ParamSpec. A value of the wrong type, or one outside the declared range, is
// not an error: it is clamped or replaced with the default, so a client can
// never drive the renderer somewhere it cannot come back from.
message ParamValue {
  oneof value {
    double number = 1;
    bool flag = 2;

    // A field name, or one option out of a fixed set. Which of the two is
    // decided by the parameter's ParamSpec.
    string text = 3;
  }
}

message FloatParam {
  double default_value = 1;
  double min = 2;
  double max = 3;

  // Hint that useful values span orders of magnitude, so a control should be
  // laid out logarithmically.
  bool logarithmic = 4;
}

message BoolParam {
  bool default_value = 1;
}

// FieldParam takes the name of a field on the source object.
//
// The empty string means "choose one", and what that resolves to is the
// renderer's business. Nothing validates the name when it is set: the object it
// must exist on is not known until draw time, and a field can appear or vanish
// after the fact.
message FieldParam {}

// ChoiceParam takes one option out of a fixed set. A value outside the set is
// rejected rather than corrected, because there is no nearest valid choice.
message ChoiceParam {
  repeated string options = 1;
  string default_value = 2;
}

// ParamSpec declares one setting of a representation kind: what it is called,
// what type it takes and what values are allowed.
message ParamSpec {
  // Key used in the `params` maps below.
  string id = 1;

  // Human-readable name.
  string label = 2;

  oneof kind {
    FloatParam number = 3;
    BoolParam flag = 4;
    FieldParam field = 5;
    ChoiceParam choice = 6;
  }
}

// Color is sRGB, each channel 0..1.
message Color {
  float r = 1;
  float g = 2;
  float b = 3;
}

// ColorSpec says how a representation takes its colour.
//
// This is always a *complete* description, unlike the parameter maps: sending
// one replaces the colouring outright, and anything left unset takes its
// default rather than its current value. Parameters are per-key because a
// client typically nudges one of them; colouring is four related settings that
// are rarely meaningful apart.
message ColorSpec {
  // Field to map across the colour map. Absent paints a flat colour — or, for
  // molecules, standard element colouring.
  optional string field = 1;

  // "viridis", "cool-warm", "grayscale", or "element". Empty means viridis.
  string map = 2;

  // Value range the colour map spans. Absent autoscales to the field's own
  // range, recomputed whenever the data changes.
  optional Range range = 3;

  // Used when `field` is absent.
  optional Color flat = 4;
}

message Range {
  float low = 1;
  float high = 2;
}

// Subset restricts a representation to part of its source dataset.
//
// This is what several representations of one object are for: chain A as
// cartoon and the ligand as ball-and-stick is one structure drawn twice over
// different parts of it.
//
// The selection is carried inline rather than by naming an uploaded buffer,
// because UploadObject creates an object and there is no way to add an array to
// an existing one — the buffer-name form would silently require a second
// streaming RPC. Selections are small: a mask over 250k points is 250 KB.
//
// There is no selection language. iris3d's position throughout is that clients
// parse their own formats and push arrays, and a client already holds the
// residue and chain structure needed to express "chain A" far more naturally
// than a grammar invented here would.
//
// A selection that does not fit the data — the wrong length for a mask, or
// nothing left after dropping out-of-range indices — draws everything and logs
// a warning rather than drawing nothing, which would be indistinguishable from
// a broken renderer.
message Subset {
  enum Encoding {
    ENCODING_UNSPECIFIED = 0;

    // `data` is element indices, in any order. Out-of-range entries are
    // dropped.
    ENCODING_INDICES = 1;

    // `data` is one value per element, non-zero to keep. Must have exactly as
    // many entries as there are elements.
    ENCODING_MASK = 2;
  }

  // What the values index into. Points and atoms, or cells and bonds.
  enum Association {
    ASSOCIATION_UNSPECIFIED = 0;
    ASSOCIATION_PER_POINT = 1;
    ASSOCIATION_PER_CELL = 2;
  }

  // Raw little-endian values, packed as for BufferSpec.
  bytes data = 1;

  Dtype dtype = 2;

  Encoding encoding = 3;

  // Defaults to per-point when unspecified.
  Association association = 4;
}

// RepresentationInfo describes one way something is being drawn.
message RepresentationInfo {
  RepresentationHandle handle = 1;

  // Registered kind id, e.g. "points" or "ball-and-stick". See
  // ListRepresentationKinds.
  string kind = 2;

  // The object whose data is drawn.
  ObjectHandle source = 3;

  // The object whose transform is inherited. Usually the same as `source`.
  ObjectHandle parent = 4;

  // Complete and in range, whatever was sent to produce it.
  map<string, ParamValue> params = 5;

  ColorSpec color = 6;

  // False if this representation has been hidden individually. An object being
  // hidden does not show up here.
  bool visible = 7;

  // How much of the source is drawn. Absent means all of it.
  //
  // The selection values themselves are not echoed back — they can be large and
  // the client sent them — so `data` is empty here and only the encoding,
  // dtype and element count are reported.
  optional SubsetInfo subset = 8;
}

// SubsetInfo describes a representation's selection without returning it.
message SubsetInfo {
  Subset.Encoding encoding = 1;
  Subset.Association association = 2;

  // Number of elements the selection keeps.
  uint64 selected = 3;
}

// RepresentationKindInfo describes a way of drawing that this build supports.
message RepresentationKindInfo {
  string id = 1;
  string label = 2;

  // Dataset kinds this can draw, using the same names as
  // `ObjectInfo.dataset_kind`.
  repeated string supports = 3;

  repeated ParamSpec params = 4;
}

message AddRepresentationRequest {
  // The object whose data to draw.
  ObjectHandle source = 1;

  // Registered kind id. Empty picks whatever the server draws this kind of
  // dataset with by default, which is what an upload would have chosen.
  string kind = 2;

  // The object whose transform to inherit. Absent means `source`, drawing the
  // data where it already is.
  optional ObjectHandle parent = 3;

  // Settings to override. Anything not named takes the kind's default — this
  // is a new representation, so there is no previous value to keep.
  map<string, ParamValue> params = 4;

  // Absent colours by the first scalar field, matching what an upload does.
  optional ColorSpec color = 5;

  // Absent draws the whole dataset.
  optional Subset subset = 6;
}

message AddRepresentationResponse {
  RepresentationInfo representation = 1;
}

message SetRepresentationRequest {
  RepresentationHandle handle = 1;

  // Settings to change. Anything not named keeps its current value — unlike
  // AddRepresentation, where it takes the default.
  map<string, ParamValue> params = 2;

  // Absent leaves colouring alone. Present replaces it entirely; see ColorSpec.
  optional ColorSpec color = 3;

  // Hide or show this representation alone, without touching its object.
  optional bool visible = 4;

  // Absent leaves the selection alone; present replaces it.
  optional Subset subset = 5;

  // Go back to drawing the whole dataset. Needed as its own field because an
  // absent `subset` already means "leave it alone", so there is otherwise no
  // way to say "clear it".
  bool clear_subset = 6;
}

message SetRepresentationResponse {
  RepresentationInfo representation = 1;
}

message RemoveRepresentationRequest {
  RepresentationHandle handle = 1;
}

message RemoveRepresentationResponse {
  // False if no representation with that handle was present.
  bool removed = 1;
}

message ListRepresentationsRequest {
  // Restrict to representations drawing this object. Absent lists all of them.
  optional ObjectHandle source = 1;
}

message ListRepresentationsResponse {
  repeated RepresentationInfo representations = 1;
}

message ListRepresentationKindsRequest {}

message ListRepresentationKindsResponse {
  repeated RepresentationKindInfo kinds = 1;
}

message ListObjectsRequest {}

message ListObjectsResponse {
  repeated ObjectInfo objects = 1;
}

message CreateObjectRequest {
  // Human-readable label. Need not be unique.
  string name = 1;
}

message CreateObjectResponse {
  ObjectHandle handle = 1;
}

message SetParentRequest {
  ObjectHandle handle = 1;

  // The new parent. Omit to detach, making the object a root.
  optional ObjectHandle parent = 2;

  // Adjust the object's local transform so it does not move in world space.
  // Without this the object keeps its local transform and therefore shifts by
  // whatever the new parent's transform is.
  bool keep_world_transform = 3;
}

message SetParentResponse {}

message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

// A rotation as a unit quaternion.
message Quaternion {
  float x = 1;
  float y = 2;
  float z = 3;
  float w = 4;
}

// Components left unset are kept as they are, so a caller can move an object
// without disturbing its rotation or scale.
message SetTransformRequest {
  ObjectHandle handle = 1;
  optional Vector3 translation = 2;
  optional Quaternion rotation = 3;
  optional Vector3 scale = 4;
}

message SetTransformResponse {}

message DeleteObjectRequest {
  ObjectHandle handle = 1;

  // Also delete every descendant. By default descendants are detached and
  // become roots, so deleting an object never destroys data the caller did not
  // name.
  bool recursive = 2;
}

message DeleteObjectResponse {
  // False if no object with that handle was present.
  bool deleted = 1;

  // Handles removed, including the named object and — when `recursive` was
  // set — its descendants.
  repeated ObjectHandle removed = 2;

  // Representations removed along with them.
  //
  // Deleting an object takes down everything drawing its data, including
  // representations placed under some *other* object — those are not in
  // `removed` and would otherwise disappear from the scene unannounced.
  repeated RepresentationHandle removed_representations = 3;
}
